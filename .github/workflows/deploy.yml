name: Deploy to GitHub Pages

# Builds the static site and publishes it to the `gh-pages` branch, which
# GitHub Pages serves at https://<user>.github.io/<repo>/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No lockfile is committed yet, so install from package.json.
      - run: npm install --no-audit --no-fund

      - run: npx nuxt generate
        env:
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/
          NITRO_PRESET: github_pages

      # Also writes .nojekyll, so the `_nuxt/` folder is served as-is.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .output/public
          publish_branch: gh-pages
